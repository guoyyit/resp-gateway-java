# Spring Boot HTTP 管理端口（与 RESP 网关端口相互独立）
server.port=8080

# ===== RESP 网关配置 =====
# RESP TCP 监听端口（绑定到 127.0.0.1）
resp.gateway.port=6390
# 后端分片数量（首次启动生效；之后由 data/topology.json 恢复）
resp.gateway.shard-count=4
# 每个分片待执行命令队列上限，超出后该分片命令返回 BUSY 错误
resp.gateway.shard-queue-capacity=256
# 单个 RESP 帧允许的最大字节数，超长帧返回协议错误并跳过该帧
resp.gateway.max-frame-bytes=67108864
# 每个连接读缓冲上限（字节）
resp.gateway.connection-read-buffer-bytes=1048576
# 每个连接允许未回复命令的上限，达到后暂停读取（流水线背压）
resp.gateway.max-inflight-per-connection=256
# 连接空闲多久后回收
resp.gateway.idle-timeout=5m
# 半包数据停滞多久视为半开连接并清理
resp.gateway.half-open-timeout=2m
# 分片健康检查周期
resp.gateway.health-check-interval=2s
# 拓扑变更策略：REJECT（拒绝旧拓扑在途命令）或 DRAIN（排空后切换）
resp.gateway.topology-change-policy=REJECT
# 配置与路由表持久化目录
resp.gateway.data-dir=data
