spring.main.web-application-type=none
gateway.port=6379
gateway.shard-count=4
gateway.shard-queue-capacity=1024
gateway.client-read-buffer-bytes=1048576
gateway.client-write-buffer-bytes=1048576
gateway.idle-timeout-ms=60000
gateway.max-frame-bytes=67108864
gateway.health-check-interval-ms=1000
gateway.health-check-timeout-ms=200
gateway.data-dir=data
